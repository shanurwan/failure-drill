# The upstream the gateway proxies to, and the two APIs the drills call.
#
#   /open/   no key. The request path never needs Redis.
#   /keyed/  needs an API key, with a rate limit and a quota. Keys, quotas and
#            rate-limit state live in Redis, so this is the path a Redis failure
#            can hurt.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: upstream
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: upstream
  template:
    metadata:
      labels:
        app.kubernetes.io/name: upstream
    spec:
      containers:
        - name: httpbin
          image: mccutchen/go-httpbin:2.18.3
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet: {path: /status/200, port: http}
            periodSeconds: 2
          resources:
            requests: {cpu: 50m, memory: 32Mi}
            limits: {memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: upstream
spec:
  selector:
    app.kubernetes.io/name: upstream
  ports:
    - name: http
      port: 8080
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: lab-apis
data:
  open.json: |
    {
      "name": "open",
      "api_id": "open",
      "org_id": "lab",
      "active": true,
      "use_keyless": true,
      "version_data": {"not_versioned": true, "versions": {"Default": {"name": "Default"}}},
      "proxy": {
        "listen_path": "/open/",
        "target_url": "http://upstream:8080/",
        "strip_listen_path": true
      }
    }
  keyed.json: |
    {
      "name": "keyed",
      "api_id": "keyed",
      "org_id": "lab",
      "active": true,
      "use_keyless": false,
      "use_standard_auth": true,
      "auth": {"auth_header_name": "Authorization"},
      "version_data": {"not_versioned": true, "versions": {"Default": {"name": "Default"}}},
      "proxy": {
        "listen_path": "/keyed/",
        "target_url": "http://upstream:8080/",
        "strip_listen_path": true
      }
    }
