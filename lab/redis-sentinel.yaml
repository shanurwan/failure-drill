# Redis with Sentinel for the lab: three Redis pods (one primary, two replicas)
# on persistent volumes, watched by three Sentinels that promote a replica when
# the primary has been unreachable for five seconds.
#
# Pods talk to each other by their stable DNS names, so a restarted pod is
# recognised as the same Redis even though its IP has changed.
apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-scripts
data:
  redis.sh: |
    #!/bin/sh
    # Start as a replica of whichever Redis the Sentinels call primary. On the
    # very first start no Sentinel answers yet, and redis-0 takes the role.
    me="$(hostname).redis"
    primary="$(redis-cli -h redis-sentinel -p 26379 --no-raw sentinel get-master-addr-by-name mymaster 2>/dev/null | sed -n '1s/^1) "\(.*\)"$/\1/p')"
    [ -n "$primary" ] || primary="redis-0.redis"
    set -- --dir /data --appendonly yes --replica-announce-ip "$me"
    if [ "$primary" != "$me" ]; then
      set -- "$@" --replicaof "$primary" 6379
    fi
    echo "starting $me, primary is $primary"
    exec redis-server "$@"
  sentinel.sh: |
    #!/bin/sh
    # Sentinel rewrites its own configuration, so it needs a writable copy.
    cat > /state/sentinel.conf <<EOF
    port 26379
    dir /state
    sentinel resolve-hostnames yes
    sentinel announce-hostnames yes
    sentinel announce-ip $(hostname).sentinel
    sentinel monitor mymaster redis-0.redis 6379 2
    sentinel down-after-milliseconds mymaster 5000
    sentinel failover-timeout mymaster 30000
    sentinel parallel-syncs mymaster 1
    EOF
    until redis-cli -h redis-0.redis ping >/dev/null 2>&1 || redis-cli -h redis-1.redis ping >/dev/null 2>&1; do
      echo "waiting for a Redis to answer"; sleep 1
    done
    exec redis-sentinel /state/sentinel.conf
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  labels:
    app.kubernetes.io/name: redis
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: redis
  ports:
    - name: redis
      port: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: sentinel
  labels:
    app.kubernetes.io/name: sentinel
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: sentinel
  ports:
    - name: sentinel
      port: 26379
---
# The address the gateway is given: any Sentinel will do.
apiVersion: v1
kind: Service
metadata:
  name: redis-sentinel
  labels:
    app.kubernetes.io/name: sentinel
spec:
  selector:
    app.kubernetes.io/name: sentinel
  ports:
    - name: sentinel
      port: 26379
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
spec:
  serviceName: redis
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
    spec:
      terminationGracePeriodSeconds: 10
      containers:
        - name: redis
          image: redis:7.4-alpine
          command: ["sh", "/scripts/redis.sh"]
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 2
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 256Mi}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: scripts
              mountPath: /scripts
      volumes:
        - name: scripts
          configMap:
            name: redis-scripts
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 256Mi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: sentinel
spec:
  serviceName: sentinel
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app.kubernetes.io/name: sentinel
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sentinel
    spec:
      terminationGracePeriodSeconds: 5
      containers:
        - name: sentinel
          image: redis:7.4-alpine
          command: ["sh", "/scripts/sentinel.sh"]
          ports:
            - name: sentinel
              containerPort: 26379
          readinessProbe:
            exec:
              command: ["redis-cli", "-p", "26379", "ping"]
            periodSeconds: 2
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {memory: 128Mi}
          volumeMounts:
            - name: state
              mountPath: /state
            - name: scripts
              mountPath: /scripts
      volumes:
        - name: state
          emptyDir: {}
        - name: scripts
          configMap:
            name: redis-scripts
